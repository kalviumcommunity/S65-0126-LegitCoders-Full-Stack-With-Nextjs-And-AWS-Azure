name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Type Check
        run: npm run type-check

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Run Prisma migrations
        env:
          DATABASE_URL: postgresql://testuser:testpass@localhost:5432/test_db
        run: npm run db:migrate:prod

      - name: Build project
        run: npm run build

      - name: Docker build
        run: docker build -t flood-warning-backend:latest .

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: Install dependencies
        run: npm ci

      - name: NPM audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

  code-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Type Check
        run: npm run type-check

      - name: Lint
        run: npm run lint
        continue-on-error: true

  notify:
    runs-on: ubuntu-latest
    needs: [test-and-build, security-scan, code-quality]
    if: always()
    steps:
      - name: Notify build status
        run: |
          if [ "${{ needs.test-and-build.result }}" = "success" ]; then
            echo "✅ Build and tests passed!"
          else
            echo "❌ Build or tests failed!"
          fi
